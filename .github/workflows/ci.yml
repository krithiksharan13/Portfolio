name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Supabase env vars aren't needed for a successful build (the client just
      # warns at runtime); the real build runs on Vercel with them set.
      - name: Build
        run: npm run build

      - name: MCP smoke test
        run: npx --yes tsx supabase/functions/mcp/smoke-test.mjs
